name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly repeats the full PR gates to catch environment and resolver drift.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  core-minimal:
    # Release gate: core plus dev test tools only. Keep every optional extra
    # explicitly excluded so this job cannot silently become an all-extras run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Fresh core-only sync
        run: >
          uv sync --all-groups
          --no-extra api --no-extra mcp --no-extra optimization
          --no-extra neural --no-extra evolutionary --no-extra foundation

      - name: Assert optional stacks are absent
        run: >
          uv run python -c "import importlib.util;
          optional = (
              'fastapi', 'uvicorn', 'mcp', 'highspy', 'torch', 'pymoo', 'deap',
              'nevergrad', 'transformers', 'accelerate', 'peft', 'PIL',
          );
          installed = [name for name in optional if importlib.util.find_spec(name) is not None];
          assert not installed, f'optional dependencies installed: {installed}'"

      - name: Core contract and fail-closed tests
        run: >
          uv run pytest
          tests/integration/test_execution_result_contract.py::test_all_registered_skills_share_execution_result_contract
          tests/unit/test_s5_vlm_contracts.py::test_vlm_generate_fail_closed_without_transformers
          -o addopts= --no-cov -q

      - name: Core CLI smoke
        run: uv run oec --help

  learning-contracts:
    # Core-only gate for oec.learning unit contracts. Keep neural/foundation
    # extras explicitly excluded so this job cannot silently become an
    # all-extras run. Heavy ML backends must stay absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Fresh core-only sync
        run: >
          uv sync --all-groups
          --no-extra api --no-extra mcp --no-extra optimization
          --no-extra neural --no-extra evolutionary --no-extra foundation

      - name: Assert optional ML stacks are absent
        run: >
          uv run python -c "import importlib.util;
          optional = (
              'torch', 'transformers', 'unsloth', 'axolotl', 'art',
          );
          installed = [name for name in optional if importlib.util.find_spec(name) is not None];
          assert not installed, f'optional dependencies installed: {installed}'"

      - name: Learning unit contracts
        run: >
          uv run pytest tests/unit/test_learning_*.py
          -o addopts= --no-cov -q

  learning-smoke:
    # Neural/foundation extras only — never unsloth/axolotl/art.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync learning smoke extras
        run: >
          uv sync --extra neural --extra foundation --extra mcp --extra api
          --all-groups

      - name: Learning smoke tests
        run: >
          uv run pytest tests/integration/test_learning_smoke.py
          -m learning_smoke -o addopts= --no-cov -q

  learning-adapters:
    # Core-only: prove fail-closed adapters without installing unsloth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Fresh core-only sync
        run: >
          uv sync --all-groups
          --no-extra api --no-extra mcp --no-extra optimization
          --no-extra neural --no-extra evolutionary --no-extra foundation

      - name: Fail-closed adapter tests
        run: >
          uv run pytest tests/unit/test_learning_adapters.py
          tests/unit/test_learning_l6_l8.py
          tests/unit/test_learning_l9_l11.py
          -o addopts= --no-cov -q

  lint-type-test:
    # Default gate: explicit extras only (never --all-extras) so future
    # adapter extras cannot leak in. addopts deselects neural/evolutionary/
    # foundation/learning_smoke/learning_adapter so this job stays fast.
    # Strong goldens live under tests/golden/test_neural_evolutionary_strong.py
    # and skill-level tests marked @pytest.mark.neural / evolutionary —
    # they run in the optional-extras job below on every push/PR, nightly,
    # and workflow dispatch, or locally:
    #   uv run pytest -m "neural or evolutionary" -o addopts= --import-mode=importlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: >
          uv sync --extra api --extra mcp --extra optimization
          --extra neural --extra evolutionary --extra foundation --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov-report=xml

      - name: Build package
        run: uv build

  scientific-ai-optional-extras:
    # Scientific AI optional-extras quality bar (OEC 3.6). Runs on every
    # PR and main push, plus nightly/manual dispatch, so a release candidate
    # cannot merge without the neural/evolutionary/foundation matrix.
    # Runs the full @neural/@evolutionary/@foundation skill matrix (not only
    # tests/golden/test_neural_evolutionary_strong.py). Strong goldens
    # are a subset of that marker set.
    # Markers: pyproject [tool.pytest.ini_options] neural / evolutionary /
    # foundation. `--import-mode=importlib` prevents duplicate skill-test
    # basenames from colliding during collection.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Scientific AI optional extras
        # mcp/api extras are required at collection time: unmarked MCP/REST
        # tests import those packages at module import even when deselected.
        run: >
          uv sync --extra neural --extra evolutionary --extra foundation
          --extra mcp --extra api --all-groups
        timeout-minutes: 30

      - name: Neural, evolutionary, and foundation marked tests
        timeout-minutes: 60
        run: >
          uv run pytest -m "neural or evolutionary or foundation"
          --import-mode=importlib
          -o addopts=
          --no-cov
          -q

      - name: Learning contracts with neural/foundation extras present
        # Offline contract run: extras are imported where needed, but tests
        # must not download models. Live Unsloth/Axolotl/ART remain unverified.
        timeout-minutes: 20
        run: >
          uv run pytest tests/unit/test_learning_l1_l5.py
          tests/unit/test_learning_l1_l5_hardening.py
          tests/unit/test_learning_l6_l8.py
          tests/unit/test_learning_l6_l15.py
          tests/unit/test_learning_l6_l12_wired.py
          tests/unit/test_learning_l9_l11.py
          tests/unit/test_learning_store.py
          tests/unit/test_learning_closeout.py
          --import-mode=importlib
          -o addopts=
          --no-cov
          -q

  installation-smoke:
    # Excluded from the default `pytest -q` gate because pyproject.toml sets
    # `-m "not slow"`. This dedicated job still runs on every push/PR, builds
    # a real wheel, and installs it into a throwaway venv before release merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: >
          uv sync --extra api --extra mcp --extra optimization
          --extra neural --extra evolutionary --extra foundation --all-groups

      - name: Installation smoke test
        run: uv run pytest -m slow --no-cov
