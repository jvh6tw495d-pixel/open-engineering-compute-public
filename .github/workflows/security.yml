name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: >
          uv sync --all-groups
          --extra api --extra mcp --extra optimization
          --extra neural --extra evolutionary --extra foundation

      - name: Bandit scan
        # Fail on medium+ only; Low findings (e.g. scientific RNG) stay in the
        # report via pyproject skips / do not block the release gate.
        run: uv run bandit -c pyproject.toml -r src/oec -ll

      - name: Dependency audit
        run: uvx pip-audit

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
