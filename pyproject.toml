[project]
name = "oec"
version = "3.6.0"
description = "Open Engineering Compute — an open framework for executable, versioned and auditable engineering skills."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Engineering Compute contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "sympy>=1.12",
  "pint>=0.23",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.20",
  "pandas>=3.0.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
optimization = [
    "highspy>=1.15.1",
]
# ADR 0031 — optional; never pull into core deps
neural = [
    "torch>=2.2",
]
evolutionary = [
    "pymoo>=0.6",
    "deap>=1.4",       # E3 genetic programming
    "nevergrad>=1.0",  # E4 black-box
]
# W6 / ADR 0038 — optional; never pull into core deps
foundation = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
    "pillow>=10.0",  # S5 (ADR 0040 D3) — bounded image decode only, no download
]
# Unsloth / Axolotl / ART are NEVER extras:
# Unsloth downgrades torch/transformers; Axolotl has no win_amd64 wheel;
# ART PyPI name is openpipe-art (import art). Calling them never auto-installs.

[project.scripts]
oec = "oec.cli.main:app"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.108",
  "pre-commit>=3.7",
  "bandit>=1.7",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
  "scipy-stubs>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oec"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["oec"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/oec"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "highspy",
  "highspy.*",
  "pandas",
  "pandas.*",
  "torch",
  "torch.*",
  "pymoo",
  "pymoo.*",
  "deap",
  "deap.*",
  "nevergrad",
  "nevergrad.*",
  "transformers",
  "transformers.*",
  "accelerate",
  "accelerate.*",
  "peft",
  "peft.*",
  "sympy",
  "sympy.*",
  "PIL",
  "PIL.*",
  "datasets",
  "datasets.*",
  "unsloth",
  "unsloth.*",
  "axolotl",
  "axolotl.*",
  "trl",
  "trl.*",
  "art",
  "art.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "skills",
  "integrations/odysseus/tests",
  "integrations/open_science/tests",
  "agents",
]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov=oec --cov-report=term-missing --cov-report=xml -m \"not slow and not neural and not evolutionary and not foundation and not learning_smoke and not learning_adapter\""
markers = [
  "slow: builds/installs a real wheel into a throwaway venv (deselected by default; run with `uv run pytest -m slow --no-cov`)",
  "neural: requires oec[neural] / torch (deselected unless installed; run with `uv run pytest -m neural`)",
  "evolutionary: requires oec[evolutionary] / pymoo (deselected unless installed; run with `uv run pytest -m evolutionary`)",
  "foundation: requires oec[foundation] / transformers (deselected unless installed; run with `uv run pytest -m foundation`)",
  "learning_smoke: optional learning smoke requiring neural/foundation extras (deselected by default)",
  "learning_adapter: fail-closed learning adapter tests (deselected by default)",
]

[tool.coverage.run]
source = ["src/oec"]
branch = true
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
# Global repo-wide gate. Deliberately NOT enforce-failing: the historical
# baseline across legacy modules (api/cli/kernel/*, non-physics) sits at
# ~86-87%, so fail_under=90 here turns a normal `pytest` into exit 1 with no
# action tied to this release's scope. The release-scoped quality bar lives
# in the dedicated physics gate (scripts/gate_physics_coverage.py), which
# enforces fail_under=90 over src/oec/physics only.
#
# To re-enable a repo-wide enforceable gate later, set fail_under to a floor
# the whole tree actually reaches (e.g. 85) and track the delta as a team
# goal. See docs/implementation/PHYSICS-CATALOG.md.
show_missing = true

[tool.bandit]
targets = ["src/oec"]
# B101: type-narrowing asserts after validation (not security checks).
# B311: stdlib random used as scientific/evolutionary RNG, not cryptography.
skips = ["B101", "B311"]
