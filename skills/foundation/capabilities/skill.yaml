id: foundation.capabilities
version: 0.1.1
status: validated
domain: foundation
title: Foundation Backend Capabilities Probe

entrypoint:
  module: implementation
  function: execute

schemas:
  input: input.schema.json
  output: output.schema.json

method:
  id: foundation_capabilities_probe
  version: 0.1.0
  iterative: false

execution:
  deterministic: true
  # Cold optional-import probes (transformers + PEFT) can exceed 10s in a fresh sandbox.
  timeout_seconds: 30
  network_access: false
  filesystem_access: false

validation:
  schema: true
  dimensional: false
  mathematical: false
  physical: false
  numerical: false

references:
  - "W6 Foundation Models — ADR 0038"
  - "ADR 0021 Backend Registry"

tags:
  - w6
  - foundation
