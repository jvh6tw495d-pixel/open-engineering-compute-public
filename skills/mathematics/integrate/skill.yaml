id: mathematics.integrate
version: 0.1.0
status: experimental
domain: mathematics
title: Integrate

entrypoint:
  module: implementation
  function: execute

schemas:
  input: input.schema.json
  output: output.schema.json

method:
  id: scalar_integration
  version: 0.1.0
  # Conservative: function mode uses adaptive quadrature (iterative).
  # Tabulated mode is a closed formula but still always sets
  # diagnostics["converged"]=True so ADR 0013 is never violated.
  iterative: true

execution:
  deterministic: true
  timeout_seconds: 10
  network_access: false
  filesystem_access: false

validation:
  schema: true
  dimensional: false
  mathematical: true
  physical: false
  numerical: true

references:
  - "Burden, R. L., Faires, J. D. (2011). Numerical Analysis, 9th ed., Chapter 4."
  - "Piessens, R. et al. (1983). QUADPACK: A Subroutine Package for Automatic Integration. Springer."
  - "SciPy documentation: scipy.integrate.quad, simpson, trapezoid"

tags:
  - mvp
  - integration
  - quadrature
